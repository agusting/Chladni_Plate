<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio de Cimática - Placa de Chladni</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: row;
            gap: 25px;
            padding: 25px;
            background: #1a1a1a;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            border: 1px solid #333;
        }

        canvas {
            background-color: #000;
            border: 1px solid #444;
            border-radius: 12px;
            box-shadow: inset 0 0 50px rgba(255,255,255,0.05);
        }

        .sidebar {
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 85vh;
            overflow-y: auto;
            padding-right: 5px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px;
            background: #252525;
            border-radius: 10px;
            border: 1px solid #333;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        label {
            font-size: 10px;
            text-transform: uppercase;
            color: #aaa;
            letter-spacing: 1px;
            font-weight: bold;
        }

        select, input[type="file"], button, input[type="color"] {
            background: #333;
            color: white;
            border: 1px solid #444;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        input[type="color"] {
            padding: 2px;
            height: 35px;
            width: 100%;
        }

        button:hover { background: #444; }
        button.active { background: #3498db; border-color: #3498db; }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .stats {
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            color: #3498db;
            line-height: 1.5;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: #ddd;
        }

        h2 { margin: 0 0 5px 0; font-weight: 300; color: #fff; }
    </style>
</head>
<body>

    <div class="container">
        <canvas id="plate"></canvas>

        <div class="sidebar">
            <h2>Laboratorio de Cimática</h2>
            
            <div class="control-group">
                <label>Fuente de Audio</label>
                <input type="file" id="audioFile" accept="audio/*">
                <button id="togglePlay">Reproducir / Pausar</button>
            </div>

            <div class="control-group">
                <label>Geometría de la Placa</label>
                <div class="row">
                    <label>Forma</label>
                </div>
                <select id="plateShape">
                    <option value="square">Cuadrada</option>
                    <option value="rectangle">Rectangular</option>
                    <option value="circle">Circular</option>
                    <option value="hexagon">Hexagonal</option>
                </select>

                <div class="row" style="margin-top:5px;">
                    <label>Grosor (Rigidez)</label>
                    <span id="thickVal" style="font-size: 10px; color:#3498db">1.0</span>
                </div>
                <input type="range" id="thickSlider" min="0.5" max="5.0" step="0.1" value="1.0">
                
                <div class="row" style="margin-top:5px;">
                    <label>Peso de Simetría</label>
                    <span id="weightVal" style="font-size: 10px; color:#3498db">0.98</span>
                </div>
                <input type="range" id="weightSlider" min="0.5" max="1.5" step="0.01" value="0.98">
                
                <label class="checkbox-container" style="margin-top:5px;">
                    <input type="checkbox" id="addMode" checked> 
                    Modo Simétrico (Suma)
                </label>
            </div>

            <div class="control-group">
                <label>Propiedades de los Granos</label>
                <div class="row">
                    <label>Tamaño del Grano</label>
                    <span id="grainSizeVal" style="font-size: 10px; color:#3498db">1.5 px</span>
                </div>
                <input type="range" id="grainSizeSlider" min="0.5" max="5.0" step="0.1" value="1.5">

                <label style="margin-top:5px;">Sensibilidad a la Vibración</label>
                <input type="range" id="sensitivity" min="0.1" max="5" step="0.1" value="2.0">
            </div>

            <div class="control-group">
                <label>Personalización de Color</label>
                <div class="row">
                    <label>Modo de Color</label>
                </div>
                <select id="colorMode">
                    <option value="custom">Personalizado</option>
                    <option value="amber">Brillo Ámbar</option>
                    <option value="freq">Reactivo a la Frecuencia</option>
                    <option value="velocity">Mapa de Calor Cinético</option>
                </select>

                <div class="row" style="margin-top:5px;">
                    <label>Color de Granos</label>
                    <input type="color" id="grainColorPicker" value="#ffffff">
                </div>

                <div class="row" style="margin-top:5px;">
                    <label>Color de Fondo</label>
                    <input type="color" id="bgColorPicker" value="#000000">
                </div>
            </div>

            <div class="control-group">
                <div class="stats">
                    Frecuencia: <span id="detectedFreq">0</span> Hz<br>
                    Modo N: <span id="modeN">0</span><br>
                    Modo M: <span id="modeM">0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('plate');
        const ctx = canvas.getContext('2d');
        const CANVAS_SIZE = 600;
        const PARTICLE_COUNT = 10000;
        
        canvas.width = CANVAS_SIZE;
        canvas.height = CANVAS_SIZE;

        let audioCtx, analyser, source, buffer;
        let isPlaying = false;
        let n = 2, m = 1;
        let currentFreq = 0;
        let particles = [];

        // Selectores UI
        const fileInput = document.getElementById('audioFile');
        const colorMode = document.getElementById('colorMode');
        const grainColorPicker = document.getElementById('grainColorPicker');
        const bgColorPicker = document.getElementById('bgColorPicker');
        const plateShape = document.getElementById('plateShape');
        const grainSizeSlider = document.getElementById('grainSizeSlider');
        const grainSizeVal = document.getElementById('grainSizeVal');
        const freqLabel = document.getElementById('detectedFreq');
        const nLabel = document.getElementById('modeN');
        const mLabel = document.getElementById('modeM');
        const sensitivity = document.getElementById('sensitivity');
        const addModeBtn = document.getElementById('addMode');
        const weightSlider = document.getElementById('weightSlider');
        const weightValLabel = document.getElementById('weightVal');
        const thickSlider = document.getElementById('thickSlider');
        const thickValLabel = document.getElementById('thickVal');

        // Función para verificar si un punto está dentro de la forma seleccionada
        function isInsideShape(x, y, shape) {
            const cx = CANVAS_SIZE / 2;
            const cy = CANVAS_SIZE / 2;
            
            switch (shape) {
                case 'circle':
                    const radius = CANVAS_SIZE * 0.45;
                    return Math.hypot(x - cx, y - cy) <= radius;
                
                case 'rectangle':
                    const rectWidth = CANVAS_SIZE * 0.9;
                    const rectHeight = CANVAS_SIZE * 0.5;
                    return Math.abs(x - cx) <= rectWidth / 2 && Math.abs(y - cy) <= rectHeight / 2;

                case 'hexagon':
                    const hexRadius = CANVAS_SIZE * 0.45;
                    const dx = Math.abs(x - cx);
                    const dy = Math.abs(y - cy);
                    if (dx > hexRadius || dy > hexRadius * Math.sqrt(3) / 2) return false;
                    return hexRadius * Math.sqrt(3) / 2 - dy >= Math.sqrt(3) / 3 * dx;

                case 'square':
                default:
                    const side = CANVAS_SIZE * 0.9;
                    return Math.abs(x - cx) <= side / 2 && Math.abs(y - cy) <= side / 2;
            }
        }

        class Grain {
            constructor() {
                this.reset();
            }

            reset() {
                const shape = plateShape.value;
                let valid = false;
                let attempts = 0;

                // Generar posiciones únicamente dentro del área delimitada
                while (!valid && attempts < 100) {
                    this.x = Math.random() * CANVAS_SIZE;
                    this.y = Math.random() * CANVAS_SIZE;
                    valid = isInsideShape(this.x, this.y, shape);
                    attempts++;
                }
                this.vx = 0;
                this.vy = 0;
            }

            update() {
                if (!isPlaying) return;

                let nx = this.x / CANVAS_SIZE;
                let ny = this.y / CANVAS_SIZE;
                let PI = Math.PI;
                let w = parseFloat(weightSlider.value);
                let thickness = parseFloat(thickSlider.value);

                let termA = Math.cos(n * PI * nx) * Math.cos(m * PI * ny);
                let termB = Math.cos(m * PI * nx) * Math.cos(n * PI * ny);
                
                let intensity = addModeBtn.checked ? (termA + (w * termB)) : (termA - (w * termB));
                let amp = Math.abs(intensity);

                let movementThreshold = 0.01 * thickness;
                
                if (amp > movementThreshold) {
                    let force = (amp / thickness) * sensitivity.value;
                    this.vx = (Math.random() - 0.5) * force;
                    this.vy = (Math.random() - 0.5) * force;
                    this.x += this.vx;
                    this.y += this.vy;
                }

                // Reiniciar grano si sale de la forma permitida
                if (!isInsideShape(this.x, this.y, plateShape.value)) {
                    this.reset();
                }
            }

            draw() {
                let color;
                switch(colorMode.value) {
                    case 'amber': color = '#ffb300'; break;
                    case 'freq': color = `hsl(${(currentFreq/8) % 360}, 80%, 60%)`; break;
                    case 'velocity': 
                        let speed = Math.abs(this.vx) + Math.abs(this.vy);
                        color = `rgb(${120 + speed * 60}, 70, ${255 - speed * 80})`;
                        break;
                    case 'custom':
                    default: color = grainColorPicker.value;
                }

                const size = parseFloat(grainSizeSlider.value);
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, size / 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for(let i=0; i<PARTICLE_COUNT; i++) particles.push(new Grain());

        async function setupAudio(file) {
            if (audioCtx) audioCtx.close();
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 2048;
            const arrayBuffer = await file.arrayBuffer();
            buffer = await audioCtx.decodeAudioData(arrayBuffer);
            startPlayback();
        }

        function startPlayback() {
            if (source) source.stop();
            source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.loop = true;
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            source.start();
            isPlaying = true;
            document.getElementById('togglePlay').classList.add('active');
        }

        function analyzeFrequency() {
            if (!isPlaying || !analyser) return;

            let bufferLength = analyser.frequencyBinCount;
            let dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            let maxVal = 0;
            let maxIndex = 0;
            for(let i = 0; i < bufferLength; i++) {
                if(dataArray[i] > maxVal) {
                    maxVal = dataArray[i];
                    maxIndex = i;
                }
            }

            currentFreq = maxIndex * audioCtx.sampleRate / analyser.fftSize;
            let thickness = parseFloat(thickSlider.value);
            
            if (maxVal > 30) {
                freqLabel.textContent = Math.round(currentFreq);
                n = Math.floor((currentFreq / 110) / (thickness * 0.8)) + 2;
                m = Math.floor(((currentFreq % 110) / 12) / (thickness * 0.8)) + 1;
                
                nLabel.textContent = n;
                mLabel.textContent = m;
            }
        }

        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) setupAudio(e.target.files[0]);
        });

        document.getElementById('togglePlay').addEventListener('click', () => {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') { audioCtx.resume(); isPlaying = true; document.getElementById('togglePlay').classList.add('active'); }
            else { audioCtx.suspend(); isPlaying = false; document.getElementById('togglePlay').classList.remove('active'); }
        });

        weightSlider.addEventListener('input', (e) => { weightValLabel.textContent = e.target.value; });
        thickSlider.addEventListener('input', (e) => { thickValLabel.textContent = e.target.value; });
        grainSizeSlider.addEventListener('input', (e) => { grainSizeVal.textContent = e.target.value + ' px'; });
        
        // Reiniciar posiciones al cambiar la forma de la placa
        plateShape.addEventListener('change', () => {
            particles.forEach(p => p.reset());
        });

        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function animate() {
            // Aplicar el color de fondo personalizado con estela (alpha de 0.25)
            ctx.fillStyle = hexToRgba(bgColorPicker.value, 0.25);
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
            
            analyzeFrequency();
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
